<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="390">
  <defs>
    <style>
      @keyframes revealText {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0 0 0); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .term-bg { fill: #0d1117; rx: 8px; }
      .term-bar { fill: #161b22; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }

      .font-code {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 13px;
        letter-spacing: 0.1px;
      }

      .c-user { fill: #58a6ff; font-weight: 600; }
      .c-path { fill: #8b949e; }
      .c-cmd  { fill: #f0f6fc; font-weight: 500; }
      .c-text { fill: #c9d1d9; }
      .c-blue { fill: #58a6ff; }
      .cursor { fill: #58a6ff; animation: blink 0.9s infinite; }

      .anim-cmd   { animation: revealText 1.2s steps(20, end) 0.2s both; }
      .anim-l1    { animation: revealText 2.4s steps(50, end) 1.5s both; }
      .anim-l2    { animation: revealText 2.4s steps(50, end) 4.0s both; }
      .anim-l3a   { animation: revealText 2.0s steps(42, end) 6.5s both; }
      .anim-l3b   { animation: revealText 2.0s steps(42, end) 8.6s both; }
      .anim-l4a   { animation: revealText 2.2s steps(45, end) 10.7s both; }
      .anim-l4b   { animation: revealText 2.0s steps(42, end) 13.0s both; }
      .anim-l5    { animation: revealText 1.2s steps(25, end) 15.1s both; }
      .anim-l6a   { animation: revealText 2.0s steps(40, end) 16.4s both; }
      .anim-l6b   { animation: revealText 1.8s steps(35, end) 18.5s both; }
      .anim-final { animation: revealText 0.6s steps(12, end) 20.4s both; }
    </style>
  </defs>

  <!-- Arka Plan -->
  <rect width="880" height="390" class="term-bg"/>

  <!-- Terminal Üst Barı -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 872,0 A 8,8 0 0,1 880,8 L 880,34 L 0,34 Z" class="term-bar"/>
  <circle cx="20" cy="17" r="5" class="dot-red"/>
  <circle cx="36" cy="17" r="5" class="dot-yellow"/>
  <circle cx="52" cy="17" r="5" class="dot-green"/>
  <text x="440.0" y="21" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" text-anchor="middle">root@owog</text>

  <!-- Komut Girişi -->
  <g transform="translate(25, 66)" class="font-code anim-cmd">
    <text y="0">
      <tspan class="c-user">root@owog</tspan><tspan class="c-path">:~$</tspan> <tspan class="c-cmd">cat about.txt</tspan>
    </text>
  </g>

  <!-- Paragraf 1 -->
  <g transform="translate(25, 102)" class="font-code c-text anim-l1">
    <text y="0">I'm Görkem Taha — <tspan class="c-blue">OWog</tspan> in the digital world. I spend every moment learning and exploring.</text>
  </g>

  <!-- Paragraf 2 -->
  <g transform="translate(25, 138)" class="font-code c-text anim-l2">
    <text y="0">I'm drawn to the aesthetics of art, the stories inside games, and the logical depth of software.</text>
  </g>

  <!-- Paragraf 3 (2 Satır) -->
  <g transform="translate(25, 164)" class="font-code c-text anim-l3a">
    <text y="0">For me, coding isn't just writing lines — it's the elegance you find</text>
  </g>
  <g transform="translate(25, 186)" class="font-code c-text anim-l3b">
    <text y="0">when a problem finally breaks open cleanly.</text>
  </g>

  <!-- Paragraf 4 (2 Satır) -->
  <g transform="translate(25, 216)" class="font-code c-text anim-l4a">
    <text y="0">The same attention to detail I once put into my drawings, I now put</text>
  </g>
  <g transform="translate(25, 238)" class="font-code c-text anim-l4b">
    <text y="0">into data pipelines and system architecture.</text>
  </g>

  <!-- Paragraf 5 -->
  <g transform="translate(25, 274)" class="font-code c-text anim-l5">
    <text y="0">Away from noise, I create.</text>
  </g>

  <!-- Paragraf 6 (2 Satır) -->
  <g transform="translate(25, 300)" class="font-code c-text anim-l6a">
    <text y="0">On my own terms, I move forward — a little more curious each day</text>
  </g>
  <g transform="translate(25, 322)" class="font-code c-text anim-l6b">
    <text y="0">than the one before.</text>
  </g>

  <!-- Bitiş Komut Satırı ve İmleç -->
  <g transform="translate(25, 360)" class="font-code anim-final">
    <text y="0">
      <tspan class="c-user">root@owog</tspan><tspan class="c-path">:~$</tspan> <tspan class="cursor">_</tspan>
    </text>
  </g>
</svg>