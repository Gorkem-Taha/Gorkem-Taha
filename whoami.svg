<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="100%" height="310">
  <defs>
    <style>
      @keyframes typeLine1 { 0% { opacity: 0; } 5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes typeLine2 { 0%, 18% { opacity: 0; } 24% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes typeLine3 { 0%, 38% { opacity: 0; } 44% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes typeLine4 { 0%, 58% { opacity: 0; } 64% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      .term-bg { fill: #0d1117; rx: 8px; }
      .term-bar { fill: #161b22; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      
      .font-code {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
      }
      
      .c-user { fill: #58a6ff; font-weight: 600; }
      .c-path { fill: #8b949e; }
      .c-cmd { fill: #f0f6fc; }
      .c-key { fill: #7ee787; font-weight: 600; }
      .c-text { fill: #c9d1d9; }
      .c-muted { fill: #8b949e; font-style: italic; }
      .cursor { fill: #58a6ff; animation: blink 1s infinite; }

      .line-1 { animation: typeLine1 1s forwards; }
      .line-2 { animation: typeLine2 1.5s forwards; }
      .line-3 { animation: typeLine3 2s forwards; }
      .line-4 { animation: typeLine4 2.5s forwards; }
    </style>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="310" class="term-bg"/>
  
  <!-- Terminal Üst Barı -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 792,0 A 8,8 0 0,1 800,8 L 800,34 L 0,34 Z" class="term-bar"/>
  <circle cx="20" cy="17" r="5" class="dot-red"/>
  <circle cx="36" cy="17" r="5" class="dot-yellow"/>
  <circle cx="52" cy="17" r="5" class="dot-green"/>
  <text x="400.0" y="21" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" text-anchor="middle">gorkemtaha — zsh — 800x310</text>

  <!-- Komut Satırı -->
  <g transform="translate(25, 65)" class="font-code line-1">
    <text y="0">
      <tspan class="c-user">owog@core</tspan><tspan class="c-path">:~$</tspan> <tspan class="c-cmd">whoami --verbose</tspan>
    </text>
  </g>

  <!-- Çıktı Satırları -->
  <g transform="translate(25, 105)" class="font-code line-2">
    <text y="0">
      <tspan class="c-key">[identity]</tspan> <tspan class="c-text">Görkem Taha — OWog in the digital realm. Exploring code, logic and data.</tspan>
    </text>
  </g>

  <g transform="translate(25, 145)" class="font-code line-3">
    <text y="0">
      <tspan class="c-key">[philosophy]</tspan> <tspan class="c-text">Coding isn't just lines; it's the elegance when a system resolves cleanly.</tspan>
    </text>
    <text y="24" class="c-muted">
      Attention to detail once shaped in art, now engineered into data pipelines.
    </text>
  </g>

  <g transform="translate(25, 210)" class="font-code line-4">
    <text y="0">
      <tspan class="c-key">[status]</tspan> <tspan class="c-text">Away from noise, building on own terms. Constantly shipping.</tspan>
    </text>
    <text y="30">
      <tspan class="c-user">owog@core</tspan><tspan class="c-path">:~$</tspan> <tspan class="cursor">_</tspan>
    </text>
  </g>
</svg>