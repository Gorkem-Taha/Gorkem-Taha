name: Generate Badges

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Custom Badges
        run: |
          python3 - << 'EOF'
          badges = [
              ("badge-linkedin.svg", "LinkedIn", "#0A66C2"),
              ("badge-portfolio.svg", "owog.dev", "#58a6ff"),
              ("badge-medium.svg", "Medium", "#f0f6fc"),
              ("badge-gmail.svg", "Gmail", "#EA4335"),
          ]

          for filename, label, color in badges:
              w = 140
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="36" viewBox="0 0 {w} 36">
                <rect width="{w}" height="36" rx="8" fill="#161b22" stroke="{color}" stroke-width="1.5"/>
                <circle cx="18" cy="18" r="4" fill="{color}"/>
                <text x="32" y="23" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,monospace" font-size="13" font-weight="600">{label}</text>
              </svg>'''
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(svg)
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badge-*.svg
          git commit -m "chore: generate custom profile badges" || echo "No changes"
          git push
