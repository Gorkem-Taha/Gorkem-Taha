name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *' # Her gece otomatik çalışır
  workflow_dispatch:     # Manuel çalıştırma butonu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. Genel İstatistikler Kartı (stats.svg)
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=onedark&count_private=true'
          path: stats.svg
          token: ${{ secrets.GH_TOKEN }}

      # 2. En Çok Kullanılan Diller Kartı (top-langs.svg)
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=onedark&count_private=true'
          path: top-langs.svg
          token: ${{ secrets.GH_TOKEN }}

      # 3. Üretilen SVG Dosyalarını Repoya Commit & Push Et
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update profile stats cards"
          git push
