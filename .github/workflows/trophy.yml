name: Update Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Generate Trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy-cli
          cd /tmp/trophy-cli
          
          # Arka planda sunucuyu başlatıyoruz
          deno run --allow-net --allow-read --allow-env api/index.ts &
          SERVER_PID=$!
          
          # Sunucunun ayağa kalkması için 5 saniye bekle
          sleep 5
          
          # SVG çıktısını yerel endpoint'ten çekip trophy.svg'ye yaz
          curl -s "http://localhost:8080/?username=${{ github.repository_owner }}&theme=onedark" -o $GITHUB_WORKSPACE/trophy.svg
          
          # Sunucuyu kapat
          kill $SERVER_PID || true

      - name: Check Generated File
        run: |
          ls -la trophy.svg
          head -n 5 trophy.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update profile trophies"
          git push
