name: Update Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Generate Trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Orijinal Deno script'ini klonlayıp yerelde çalıştırıyoruz
          git clone https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy-cli
          deno run --allow-net --allow-read --allow-env /tmp/trophy-cli/cli.ts --username=${{ github.repository_owner }} --theme=onedark --output=trophy.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git commit -m "chore: update profile trophies"
          git push
