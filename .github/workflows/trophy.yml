name: Update Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Trophy SVG via Docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resmi trophy sunucusunu arka planda başlatıyoruz
          docker run -d -p 8080:8080 --name trophy-server -e GITHUB_TOKEN ryoma0611/github-profile-trophy:latest
          
          # Konteynerin hazır olması için bekle
          sleep 6
          
          # SVG'yi çekip dosyaya kaydet
          curl -f -s "http://localhost:8080/?username=${{ github.repository_owner }}&theme=onedark" -o trophy.svg
          
          docker stop trophy-server

      - name: Check Generated File
        run: |
          ls -la trophy.svg
          head -n 5 trophy.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update profile trophies"
          git push
