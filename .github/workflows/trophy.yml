name: Update Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Generate Trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Token ile kimlik doğrulayarak private repoyu klonluyoruz
          git clone -b VegaDeftwing-master https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Gorkem-Taha/github-profile-trophy.git /tmp/trophy-server
          cd /tmp/trophy-server
          
          # Yerel debug sunucusunu başlatıyoruz
          deno run --allow-net --allow-read --allow-env debug.ts &
          SERVER_PID=$!
          
          sleep 6
          
          # SVG çıktısını alıyoruz
          curl -s "http://localhost:8080/?username=${{ github.repository_owner }}&theme=onedark" -o $GITHUB_WORKSPACE/trophy.svg
          
          kill $SERVER_PID || true

      - name: Check Generated File
        run: |
          ls -la trophy.svg
          head -n 5 trophy.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update profile trophies"
          git push
