<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="100%" height="6">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0">
        <animate attributeName="offset" values="-0.5; 1" dur="2.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9">
        <animate attributeName="offset" values="0; 1.5" dur="2.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0">
        <animate attributeName="offset" values="0.5; 2" dur="2.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Arka plan ince sabit hat -->
  <line x1="0" y1="3" x2="900" y2="3" stroke="#21262d" stroke-width="1" />

  <!-- Üzerinden kayan parlak mavi ışık -->
  <line x1="0" y1="3" x2="900" y2="3" stroke="url(#glow)" stroke-width="2" stroke-linecap="round" />
</svg>
